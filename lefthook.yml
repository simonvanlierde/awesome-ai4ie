pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,mjs,ts,jsx,tsx,astro,json,jsonc,css,md}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    test:
      run: pnpm test
    typecheck:
      run: pnpm run check
