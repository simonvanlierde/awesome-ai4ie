[global]
  # READMEs have long badge and link lines that don't wrap, so MD013 would flag nearly every line.
  # MD033: the README, the issue links and the site's pages use HTML for layout and Starlight
  # classes. MD041: the pull request template starts with a comment. MD057: `../../issues/new`
  # links work on GitHub only.
  disable = ["MD013", "MD033", "MD041", "MD057"]
  flavor  = "gfm"
