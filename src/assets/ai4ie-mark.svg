<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI4IE">
  <rect width="32" height="32" fill="#2148a8"/>
  <!-- The large mark (64 px and up): public/favicon.svg plus a hairline gap each side of the
       stem, so the I of AI4IE reads apart from the 4 and the E. Below 64 px the gaps close
       up, so small uses keep favicon.svg. -->
  <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <mask id="gap"><rect width="32" height="32" fill="#fff" stroke="none"/><rect x="16.8" y="0" width="5.4" height="32" fill="#000" stroke="none"/></mask>
    <g mask="url(#gap)">
      <path d="M11.6 18.4 L6.9 25.5 M19.5 6.5 L25.3 6.5 M19.5 25.5 L25.3 25.5" opacity="0.4"/>
      <path d="M19.5 6.5 L11.6 18.4 L24.2 18.4"/>
    </g>
    <path d="M19.5 6.5 L19.5 25.5" stroke="#b9ccf5"/>
  </g>
</svg>
