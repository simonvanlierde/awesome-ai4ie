# Tools, datasets, models, courses, videos, posts and communities, outside the
# reading list. The tools pages, the prompts-and-skills page and the explainer
# sections render their lists from here with <Resources />, so an entry shows up
# wherever its kind and tags are listed.
#
# Required: id, title, url, kind, blurb (one line, why it's worth your time),
# checked (YYYY-MM, when you last opened the link and checked the text).
# Optional: good and notFor (the "Good for" / "Not for" verdict), ie, topic and
# ml tags from src/data/tags.ts (empty ie = not IE-specific), and for tools cost, data
# (leaves | can-stay-local | local) and group (assistant | coding | research |
# library | local: which list on the tools pages). status: proposal marks an
# entry the group has not vetted yet. Text fields may hold Markdown links.
# The schema is resourceSchema in src/data/schemas.ts; CONTRIBUTING.md has the rest.

