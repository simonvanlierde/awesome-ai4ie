# Curated reading list, rendered on the Literature & resources page.
# One entry per paper; id = citation key. Required fields: title, authors
# (a list, one "Surname, I." per author; add `etAl: true` when the list is cut
# short), year, doi (bare 10.x id) or arxiv (bare id) or both, blurb (one line,
# why read this), type, added (YYYY-MM). Optional: status: proposal, for an
# entry a curator suggests before the group has vetted it.
# Tags must exist in src/data/tags.ts; the test suite enforces this.
# See CONTRIBUTING.md for how to add an entry.

