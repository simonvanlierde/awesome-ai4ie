name: CI & Deploy

# Pull requests run lint, type check, tests and build. Pushes to main also deploy,
# and only after check and build pass (`needs:`).
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run, which carries the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Lint & format check
        run: pnpm run lint
      - name: Type check
        run: pnpm run check
      - name: Test (with coverage)
        run: pnpm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          # Public repos can upload tokenless; add CODECOV_TOKEN as a repo secret if it rate-limits.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # withastro/action has no node-version-file input, so read .nvmrc here.
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      # Builds the Astro site (also validates internal links) and uploads the Pages artifact.
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      # withastro/action leaves node_modules and dist/ in place, so axe can scan the build.
      # No --with-deps: the runner has Chromium's libraries, and apt would only add
      # fonts the site does not use, from a mirror that can take minutes for them.
      - run: pnpm exec playwright install chromium
      - name: Accessibility (axe, WCAG 2.2 AA, light and dark)
        run: |
          pnpm exec astro preview --port 4321 &
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:4321/ && break; sleep 1; done
          pnpm run test:a11y

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
