name: CI & Deploy

# PRs run lint, type check, test and build. Pushes to main run the same, then deploy;
# deploy is gated on both passing via `needs:`, so a red build never ships.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run, which carries the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint & format check
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test (with coverage)
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          # Public repos can upload tokenless; add CODECOV_TOKEN as a repo secret if it rate-limits.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the Astro site (also validates internal links) and uploads the Pages artifact.
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          # withastro/action has no node-version-file input, so this is pinned
          # separately from .nvmrc; keep the two in sync when bumping Node.
          node-version: 26
      # withastro/action leaves node_modules and dist/ in place, so axe can scan the build.
      - run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA, light and dark)
        run: |
          npx astro preview --port 4321 &
          for _ in $(seq 30); do curl -sf http://localhost:4321/awesome-ai4ie/ >/dev/null && break; sleep 1; done
          npm run test:a11y

  deploy:
    needs: build
    # Only deploy on a push to main, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # Allow one concurrent deployment; don't cancel an in-progress one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
