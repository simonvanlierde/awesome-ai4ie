name: CI & Deploy

# Pull requests run lint, type check, tests and build, and an open, non-draft pull
# request from this repo gets a Cloudflare Preview (preview-retire.yml deletes it).
# Pushes to main also deploy, only after check and build pass (`needs:`): to GitHub
# Pages, which serves ai4ie.org, and to the Worker on workers.dev.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a push run, which carries the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-pnpm
      - name: Lint & format check
        run: pnpm run lint
      - name: Dependency licences
        run: pnpm run licenses
      - name: Type check
        run: pnpm run check
      - name: Test (with coverage)
        run: pnpm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          # Public repos can upload tokenless; add CODECOV_TOKEN as a repo secret if it rate-limits.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pushes and this repo's own pull requests have the Workers AI secrets; forks do not.
      EMBED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # Eco CI models the job's energy from CPU utilisation (hosted runners expose no RAPL).
      # send-data: false keeps the run off its hosted dashboard. CO2 is attributed to the
      # maintainer's grid, Dutch location-based 262 gCO2e/kWh (Electricity Maps, 2025);
      # hosted runners sit in Azure regions with other intensities.
      # Power curve: the action's default, 4-vCPU AMD EPYC 7763. Hosted runners mix CPUs (EPYC 7763
      # and 9V74, Xeon 8370C, 8573C and 6975P-C in 2026-11) and Eco CI has a curve only for the 7763,
      # so read the joules as an order of magnitude. The window runs from this step to get-measurement,
      # about 92 to 95% of the job: set-up, post steps and the other jobs are not counted.
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        # Monitoring only, like the Eco CI steps after the build.
        continue-on-error: true
        with:
          task: start-measurement
          send-data: false
          json-output: true
          co2-calculation-method: constant
          co2-grid-intensity-constant: 262
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the sitemap's <lastmod> and each page's "Last updated" come
          # from git, and a shallow clone has no dates to give.
          fetch-depth: 0
      # withastro/action has no node-version-file input, so read .nvmrc here.
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      # Brings back the last build's vectors so `pnpm run embed` only embeds changed entries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.EMBED == 'true'
        with:
          path: |
            src/data/literature-vectors.json
            src/data/literature-map-vectors.json
          key: literature-vectors-${{ github.run_id }}
          restore-keys: literature-vectors-
      # Embeds the reading list with Workers AI for meaning search and the map, which the
      # build then ships. Only this step holds the Workers AI and OpenAlex secrets, so the
      # dependencies' install and build code never sees them. A fork's pull request gets no
      # secrets and builds without vectors; on this repo's pull requests and on main a failed
      # embed fails the job.
      # withastro/action sets pnpm up again, so this store cache would have nothing to save.
      - if: env.EMBED == 'true'
        uses: $/.github/actions/setup-pnpm
        with:
          cache: "false"
      - name: Embed the reading list
        if: env.EMBED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional: the embed step reads each abstract from OpenAlex, and a key lifts its daily limit.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: pnpm run embed
      # Builds the Astro site (also validates internal links) and uploads the Pages artifact.
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        with:
          node-version: ${{ steps.node.outputs.version }}
          build-cmd: pnpm run build
      - name: Configured Turnstile key is present in the build
        if: vars.PUBLIC_TURNSTILE_SITE_KEY != ''
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: grep -Fq "data-turnstile-site-key=\"$PUBLIC_TURNSTILE_SITE_KEY\"" dist/contribute/index.html
      # Rows 0 to n-1, each named once, and 4096 bytes a row: the embedding model gives
      # 1024 float32 values.
      - name: Every entry has a vector
        if: env.EMBED == 'true'
        run: >-
          jq -e --argjson bytes "$(stat -c %s dist/literature-vectors.bin)"
          'length > 0 and ([.[].vectorRow] | sort) == [range(length)]
          and $bytes == length * 4096'
          dist/literature-index.json
      # The map's input: every entry has a title-and-abstract vector, or the map would drop it.
      - name: Every entry has a map vector
        if: env.EMBED == 'true'
        run: |
          jq -e --argjson n "$(jq length dist/literature-index.json)" \
            '.vectors as $v | (.keys | length == $n) and all(.keys[]; $v[.] != null)' \
            src/data/literature-map-vectors.json
          ! grep -q "not placed yet" dist/literature/index.html
      # The Worker's tests use hand-written fixtures; this checks the build gives what they mimic.
      - name: Worker data has the fields the tools read
        run: |
          jq -e 'length > 0 and all(.[]; .id and .title and .href and .year)' dist/literature-index.json
          jq -e '(.applications | length > 0) and (.resources | length > 0) and (.skills | length > 0)
            and all(.applications[]; .id and .name and .ie and .ml and .href)
            and all(.resources[]; .id and .title and .url and .kind and .ie and .topic)' dist/mcp-data.json
      - name: Page weight budget
        run: pnpm run page-weight
      # The vocabulary against SkoHub Vocabs' SHACL shape, pinned to a commit of
      # skohub-io/skohub-shapes. pyshacl exits 1 on a violation.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.9"
      - name: Vocabulary is valid SKOS
        run: |
          curl -fsSL -o "$RUNNER_TEMP/skohub.shacl.ttl" https://raw.githubusercontent.com/skohub-io/skohub-shapes/ce46984871b93cb129ce5b71c12e25dc0876de90/skohub.shacl.ttl
          uvx --exclude-newer "1 week" pyshacl@0.40.2 -s "$RUNNER_TEMP/skohub.shacl.ttl" -sf turtle -df turtle dist/vocabulary.ttl
      # Checks wrangler.jsonc against dist/ here, not first on the push-to-main deploy.
      - name: Workers config (dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler"
      # withastro/action leaves node_modules and dist/ in place, so axe can scan the build.
      # No --with-deps: the runner has Chromium's libraries, and apt would only add
      # fonts the site does not use, from a mirror that can take minutes for them.
      - run: pnpm exec playwright install chromium
      - name: Accessibility (axe, WCAG 2.2 AA, light and dark)
        run: |
          pnpm exec astro preview --port 4321 &
          for _ in $(seq 30); do curl -s -o /dev/null http://localhost:4321/ && break; sleep 1; done
          pnpm run test:a11y
      # Monitoring only: the Eco CI steps below never block the deploy jobs, and run on a failed
      # build too, since it used energy as well. Settings carry over from start-measurement: the
      # send-data and grid-intensity defaults these steps log are unused.
      # Its "Missing data points ... backfilled" warning is routine: the 1 s sampler misses ticks under load.
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        continue-on-error: true
        if: ${{ !cancelled() }}
        with:
          task: get-measurement
          label: build
      # Writes the energy and CO2 table to the step summary.
      - uses: green-coding-solutions/eco-ci-energy-estimation@782dd4a31bc426a6ae26a7b08d89af454b10ffc0 # v5.3.0
        continue-on-error: true
        if: ${{ !cancelled() }}
        with:
          task: display-results
          display-badge: false
      # v5.3.0 writes only the per-measurement file (its data-total-json output stays empty):
      # steps[] of label, cpu_avg_percent, energy_joules, power_avg_watts, time, all strings.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ !cancelled() }}
        with:
          name: eco-ci
          path: /tmp/eco-ci/lap-data.json
          if-no-files-found: warn
          # A re-run attempt replaces the earlier attempt's file instead of failing on the name.
          overwrite: true

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  deploy-workers:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: workers-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://awesome-ai4ie.simonvanlierde.workers.dev/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-pnpm
      # The build job's Pages artifact: dist/ as one tar file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Deploy to Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --message "${GITHUB_SHA::7}"
      # A liveness check: production answers a search. It cannot tell the new version from the
      # old one; curl retries while the deploy goes live.
      - name: Meaning search answers on production
        shell: bash
        run: >-
          curl -fsS --retry 6 --retry-all-errors --retry-delay 10 -X POST
          https://awesome-ai4ie.simonvanlierde.workers.dev/api/search -H 'content-type: application/json'
          -d '{"q": "which papers map building stocks from satellites?"}' | jq -e '.hits | length > 0'

  # Fork pull requests get no secrets, and drafts are not ready to show, so preview skips them.
  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      url: ${{ steps.preview.outputs.url }}
    # Shared with preview-retire.yml, so a deletion waits for an upload in flight.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: cloudflare-preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      # The run may have queued behind a close or a move to draft.
      - name: Check the pull request is still open and ready
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if test -z "$CLOUDFLARE_API_TOKEN"; then
            echo "::notice::No Preview: the repo has no CLOUDFLARE_API_TOKEN secret."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deploy="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.state == "open" and (.draft | not)')"
          test "$deploy" = true || echo "::notice::No Preview: the pull request is closed or a draft."
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.policy.outputs.deploy == 'true'
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-pnpm
        if: steps.policy.outputs.deploy == 'true'
      # The build job's Pages artifact: dist/ as one tar file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.policy.outputs.deploy == 'true'
        with:
          name: github-pages
      - if: steps.policy.outputs.deploy == 'true'
        run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Create or update the Preview
        id: preview
        if: steps.policy.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          set -o pipefail
          pnpm exec wrangler preview --name "pr-$PR" --json | tee preview.json
          # Wrangler prints upload progress before the JSON object on stdout.
          url="$(sed -n '/^{/,$p' preview.json | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A missing binding passes the deploy and only fails on the first request. The new
      # version takes some seconds to go live, so curl retries.
      - name: Meaning search answers on the Preview
        if: steps.policy.outputs.deploy == 'true'
        env:
          URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: >-
          curl -fsS --retry 6 --retry-all-errors --retry-delay 10 -X POST "${URL%/}/api/search" -H 'content-type: application/json'
          -d '{"q": "which papers map building stocks from satellites?"}' | jq -e '.hits | length > 0'
      - name: MCP answers on the Preview
        if: steps.policy.outputs.deploy == 'true'
        env:
          URL: ${{ steps.preview.outputs.url }}
        shell: bash
        # A reply is plain JSON or one SSE "data:" event.
        run: >-
          curl -fsS --retry 6 --retry-all-errors --retry-delay 10 -X POST "${URL%/}/mcp"
          -H 'content-type: application/json' -H 'accept: application/json, text/event-stream'
          -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "list_applications", "arguments": {}}}'
          | sed -n -e 's/^data: //' -e '/^{/p' | jq -e '.result.isError == false'

  # Posts the Preview's address as one pull request comment, edited on each push. A job of its
  # own, so the write token never shares a runner with wrangler and the installed packages.
  # It also runs when the checks above fail, so a failing Preview still shows its link.
  preview-comment:
    needs: preview
    if: ${{ !cancelled() && needs.preview.outputs.url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Comment the Preview address
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.preview.outputs.url }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/preview-comment.sh" Preview "$URL"'
