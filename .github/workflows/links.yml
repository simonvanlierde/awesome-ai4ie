name: Link check

# Checks every external link and DOI in the content and data files once a week, and
# every Wikidata and OpenAlex link in the tag vocabulary, which can be merged or deleted
# while it still answers 200. Not on PRs: a publisher being down for an hour should not
# block a merge. On failure each job opens one issue, or updates the open one.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The literature data holds bare DOIs and arXiv ids, not URLs, so list them
      # as links for lychee.
      - name: List the paper links
        run: |
          sed -nE 's#^ *doi: *"?([^"]+)"?.*$#https://doi.org/\1#p; s#^ *arxiv: *"?([^"]+)"?.*$#https://arxiv.org/abs/\1#p' \
            src/data/literature.yaml > paper-links.txt
          echo "$(wc -l < paper-links.txt) paper links"

      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          # --accept 403,429: DOIs that land on publisher bot walls (Elsevier, ACS,
          # Wiley and others), the AI chat apps and some news sites answer 403
          # to any script, and some hosts rate-limit with 429. Both mean the
          # server is there, so they count as fine rather than being excluded,
          # which would also hide a real 404 or a dead domain.
          # --root-dir + --exclude file://: root-relative site links (`/tools/`)
          # are checked by the build's link validator, not here.
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --scheme https --scheme http
            --root-dir ${{ github.workspace }}
            --exclude '^file://'
            --max-retries 2 --timeout 30
            'src/content/docs/**/*.md' 'src/content/docs/**/*.mdx' paper-links.txt

      # Creating the issue through the REST API also creates the label if it is missing.
      - name: Open or update the link-check issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issues="repos/${GITHUB_REPOSITORY}/issues"
          # GitHub caps an issue body at 65,536 characters; a long report is cut.
          head -c 60000 lychee/out.md > body.md
          number=$(gh api "${issues}?labels=broken-links&state=open" -q '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "${issues}/${number}" -F body=@body.md >/dev/null
          else
            gh api "$issues" -f title="Broken links found by the weekly link check" \
              -F body=@body.md -f 'labels[]=broken-links' >/dev/null
          fi

      # A clean run closes the issue a previous run opened, so it never goes stale.
      - name: Close the link-check issue
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          issues="repos/${GITHUB_REPOSITORY}/issues"
          number=$(gh api "${issues}?labels=broken-links&state=open" -q '.[0].number // empty')
          if [ -n "$number" ]; then
            gh api -X PATCH "${issues}/${number}" -f state=closed -f state_reason=completed >/dev/null
          fi

  vocabulary:
    name: "vocabulary: Wikidata and OpenAlex links"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run vocabulary-links

  notify:
    # Scheduled runs only. The run log lists each dead link beside its concept.
    name: "vocabulary: report failure"
    needs: ['vocabulary']
    # A job that runs past timeout-minutes ends cancelled, not failed.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      issues: write # opens or comments on the failure issue
    uses: $/.github/workflows/report-failure.yml
    with:
      title: Weekly vocabulary link check failed

  resolved:
    # A clean scheduled run closes the failure issue, so it never goes stale.
    name: "vocabulary: close the failure issue"
    needs: ['vocabulary']
    if: github.event_name == 'schedule' && needs.vocabulary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # closes the failure issue
    steps:
      - name: close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Weekly vocabulary link check failed # the notify job's title
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          issue=$(gh issue list --state open --author app/github-actions --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "A clean scheduled run: $RUN_URL"
          fi
