name: OpenAlex candidates

# Once a week, looks for new AI-in-IE papers on OpenAlex and adds them to
# src/data/candidates.yaml as leads, on one branch with one open PR. A later run
# adds to that branch, so a curator's edits there are kept. Nothing reaches main
# without a person merging it. No secret: OpenAlex needs no key.
on:
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: openalex-candidates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile

      # Continue the branch of an open PR, so leads a curator already marked stay
      # marked, with main merged in so the script and literature.yaml are current.
      # Otherwise (no PR, or one closed unmerged) start again from main.
      - name: Check out the candidates branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            git fetch origin "$BRANCH"
            git switch "$BRANCH"
            git merge --no-edit origin/main
          else
            git switch -c "$BRANCH"
            echo "FRESH=1" >>"$GITHUB_ENV" # replaces a closed PR's branch
          fi

      - shell: bash # with pipefail, so a failed run stops the job
        run: node scripts/openalex-candidates.mjs | tee "$RUNNER_TEMP/summary.txt"

      - name: Commit, push and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          git diff --quiet -- src/data/candidates.yaml && { echo "No new leads."; exit 0; }
          git add src/data/candidates.yaml
          git commit -q -m "chore(literature): add OpenAlex leads of $(date -u +%F)"
          git push ${FRESH:+--force} "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore(literature): new OpenAlex candidates" \
              --body "New leads from OpenAlex in \`src/data/candidates.yaml\`. Mark each one \`rejected\` (with a why) or \`listed\`, as MAINTAINING.md describes, then merge. A run by the workflow token starts no checks: close and reopen this PR to run CI."
          fi
          # Each run's counts, and a warning when its leads score low, for the curator.
          gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/summary.txt"
