name: Retire Preview

# Deletes a pull request's Cloudflare Preview (ci.yml creates it) when the pull request
# closes or goes back to draft. Runs on pull_request, never pull_request_target, so a
# fork's code never runs with credentials; a fork has no Preview to delete anyway.
on:
  pull_request:
    types: [closed, converted_to_draft]

permissions:
  contents: read

# Shared with ci.yml's preview job, so deletion waits for an upload in flight.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check this pull request can have a Preview
        id: policy
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if test "$FORK" = true; then
            echo "::notice::No Preview to delete: fork pull requests never get one."
          elif test -z "$CLOUDFLARE_API_TOKEN"; then
            echo "::notice::Cannot delete the Preview: the repo has no CLOUDFLARE_API_TOKEN secret."
          else
            echo "retire=true" >> "$GITHUB_OUTPUT"
          fi
      # The base branch, not the head: a branch made before Workers hosting has no wrangler,
      # though ci.yml previews its merge ref. Deleting needs only the CLI and the Worker name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.policy.outputs.retire == 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        if: steps.policy.outputs.retire == 'true'
        with:
          runtime: node@26
          cache: true
          install: false
      - if: steps.policy.outputs.retire == 'true'
        run: pnpm install --frozen-lockfile
      - name: Delete the Preview
        if: steps.policy.outputs.retire == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # A draft that never had a Preview fails with "Preview not found. [code: 10025]",
        # which leaves nothing to delete.
        run: |-
          if pnpm exec wrangler preview delete --name "pr-$PR" --skip-confirmation >delete.log 2>&1; then
            cat delete.log
          elif grep -q 'code: 10025' delete.log; then
            echo "::notice::pr-$PR had no Preview to delete."
          else
            cat delete.log
            exit 1
          fi
