name: Suggest something else
description: A prompt, a checklist item, a pitfall, a demo, or a fix to any page.
title: "[Suggestion] "
labels: [entry]
body:
  - type: dropdown
    id: page
    attributes:
      label: Which part of the site?
      options:
        - Map of AI applications
        - Literature & resources
        - Best practices & guides
        - Tools & hardware
        - Demos
        - Community & contribute
        - The site as a whole
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: Describe the addition or correction and link to the relevant page or source.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Use and limits
      description: Where does it help, and where does it fall short?
