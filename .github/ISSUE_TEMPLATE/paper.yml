name: Suggest a paper
description: Add a paper to the reading list.
title: "[Paper] "
labels: [entry, paper]
body:
  - type: input
    id: id
    attributes:
      label: DOI or arXiv id
      description: Enter the ID without the URL. We use it to look up the title, authors and year.
      placeholder: 10.1111/jiec.13313 or 2401.01234
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why read it?
      description: In one or two sentences, say what the paper shows and where the result applies.
    validations:
      required: true
  - type: input
    id: gap
    attributes:
      label: Does it fill a gap on the map?
      description: If you came from a gap under "Not mapped yet", it's filled in here. A field, topic or technique that isn't in the lists below gets its tag with its first paper.
  # The four dropdowns list the labels in src/data/vocabulary.yaml; forms.test.ts keeps them in step.
  - type: dropdown
    id: ie
    attributes:
      label: IE field
      description: Pick all that apply. Leave it empty for an ML paper that isn't about IE.
      multiple: true
      options:
        - Life cycle assessment
        - Socio-economic metabolism
        - Input-output
        - Circular economy
        - Industrial symbiosis
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: The system or problem the paper is about. Pick all that apply, or none. Name a topic that is not listed in the gap field above.
      multiple: true
      options:
        - Buildings & construction
        - Chemicals & toxicity
        - Electronics & e-waste
        - Metals & critical materials
        - Agriculture & food
        - Water
        - Product lifetime, reuse & repair
        - Energy & industrial decarbonisation
        - Supply chains & resource security
  - type: dropdown
    id: ml
    attributes:
      label: AI technique
      description: Pick all that apply.
      multiple: true
      options:
        - LLMs & agents
        - NLP & information extraction
        - Computer vision
        - Detection & segmentation
        - Depth & 3D geometry
        - Remote sensing
        - Tabular ML & regression
        - Generative models
        - Foundation models & transformers
        - Anomaly & condition detection
        - Uncertainty & probabilistic ML
        - Knowledge graphs
        - Recommender systems
  - type: dropdown
    id: type
    attributes:
      label: Kind of paper
      multiple: true
      options:
        - ML landmark
        - Research practice
        - Review
        - Method
        - Dataset
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I've read the paper, and it says what I wrote above. An AI summary or the abstract alone doesn't count.
          required: true
