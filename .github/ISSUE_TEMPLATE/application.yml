name: Map an application
description: Add an example of AI use in industrial ecology to the map.
title: "[Application] "
labels: [entry, application]
body:
  - type: input
    id: name
    attributes:
      label: The application
      description: A short name for what the AI does.
      placeholder: Reading model numbers from appliance labels at a recycler
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What does it do?
      description: One or two sentences on the IE task and how AI helps with it.
    validations:
      required: true
  - type: textarea
    id: maturity
    attributes:
      label: How far along is it?
      description: Is it an idea, a lab demo, tested on real data, or in routine use? Say what supports that assessment and where the method fails.
    validations:
      required: true
  - type: textarea
    id: papers
    attributes:
      label: Papers behind it
      description: Add DOIs or arXiv IDs, one per line, if there are papers. They can be new to the reading list.
  # The two dropdowns list the labels in src/data/vocabulary.yaml; forms.test.ts keeps them in step.
  - type: dropdown
    id: ie
    attributes:
      label: IE field
      multiple: true
      options:
        - Life cycle assessment
        - Socio-economic metabolism
        - Input-output
        - Circular economy
        - Industrial symbiosis
  - type: dropdown
    id: ml
    attributes:
      label: AI technique
      multiple: true
      options:
        - LLMs & agents
        - NLP & information extraction
        - Computer vision
        - Detection & segmentation
        - Depth & 3D geometry
        - Remote sensing
        - Tabular ML & regression
        - Generative models
        - Foundation models & transformers
        - Anomaly & condition detection
        - Uncertainty & probabilistic ML
        - Knowledge graphs
        - Recommender systems
  - type: input
    id: gap
    attributes:
      label: A field or technique that isn't listed
      description: For example, a gap listed under "Not mapped yet" on the map page. A new tag comes in with its first paper.
