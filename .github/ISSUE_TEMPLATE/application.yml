name: Map an application
description: A place where AI is used in IE, for the applications map. No YAML or pull request needed.
title: "[Application] "
labels: [entry, application]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer turns this into an entry on the map. Every entry carries a maturity call backed by papers, so those two fields matter most. Without a paper we can still list it as a lead.
  - type: input
    id: name
    attributes:
      label: The application
      description: A short name for what the AI does.
      placeholder: Reading model numbers from appliance labels at a recycler
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What does it do?
      description: One or two sentences on the IE task and how AI helps with it.
    validations:
      required: true
  - type: textarea
    id: maturity
    attributes:
      label: How far along is it?
      description: In plain words, with the evidence. Is it an idea, a lab demo, validated on real data, or in routine use somewhere? Say where it fails.
    validations:
      required: true
  - type: textarea
    id: papers
    attributes:
      label: Papers behind it
      description: DOIs or arXiv ids, one per line. Papers that aren't on the reading list yet are welcome; we add both.
  # The two dropdowns list the labels in src/data/tags.ts; forms.test.ts keeps them in step.
  - type: dropdown
    id: ie
    attributes:
      label: IE field
      multiple: true
      options:
        - LCA & footprinting
        - MFA & stocks and flows
        - Waste, EoL & circularity
        - Urban mining & secondary resources
  - type: dropdown
    id: ml
    attributes:
      label: AI technique
      multiple: true
      options:
        - LLMs & agents
        - NLP & information extraction
        - Computer vision
        - Detection & segmentation
        - Depth & 3D geometry
        - Remote sensing
        - Tabular ML & regression
        - Generative models
        - Foundation models & transformers
        - Anomaly & condition detection
  - type: input
    id: gap
    attributes:
      label: A field or technique that isn't listed
      description: For example, a gap listed under "Not mapped yet" on the map page. A new tag comes in with its first paper.
