name: Set up pnpm
description: Node, pnpm and the locked dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@26
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
      shell: bash
