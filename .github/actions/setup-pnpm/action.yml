name: Set up pnpm
description: Node, pnpm and the locked dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        runtime: node@26
        cache: true
        install: false
    - run: pnpm install --frozen-lockfile
      shell: bash
