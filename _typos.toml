[default.extend-identifiers]
# Preserve the format plural before typos splits its acronym.
PNGs = "PNGs"

# Words typos must leave alone. Add your own below.
[default.extend-words]
# Mean absolute percentage error, and a court case's name.
MAPE = "MAPE"
Mata = "Mata"

# The font width axis tag, in scripts/subset-fonts.py and the Archivo licence text.
wdth = "wdth"

[files]
# Generated codepoint list and OFL texts.
extend-exclude = ["src/assets/fonts/*"]
