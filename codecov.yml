# Codecov reports coverage; CI's tests are the gate. A pull request fails only when
# total coverage drops by more than 2 points. Coverage of the new lines is shown, not
# enforced.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        informational: true

# No pull request comment. The coverage_drop condition reads its threshold from
# coverage.status.project itself, not from project.default above, and a valid config
# has none there. So it would comment on any drop at all. The status checks above
# already show the numbers on each pull request.
comment: false
