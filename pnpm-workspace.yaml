# Install no package version younger than 7 days (in minutes), as Renovate already waits,
# so a lock refresh or a manual `pnpm add` cannot pull a release published hours ago.
minimumReleaseAge: 10080

# The only dependencies whose install scripts run.
allowBuilds:
  fsevents: true
  lefthook: true

# postcss-selector-parser fixes GHSA-rj75-hqrm-r3gf. Remove once @expressive-code/core depends on
# postcss-nested 7 or later.
# fast-uri 3.1.9 fixes four advisories in 3.1.8. Remove once ajv depends on fast-uri 3.1.9 or later.
overrides:
  fast-uri: "^3.1.9"
  postcss-selector-parser: "^7.1.6"
